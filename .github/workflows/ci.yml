name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: lake test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          test: "true"
